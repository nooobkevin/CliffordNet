run:
  profile: stable_imagenet1k
  tags: [stable, imagenet1k]

model:
  wedge_mode: fma
  ortho_weight: 0.03
  enable_diagnostics: true
  diag_log_interval: 50

recipe:
  # Conservative ImageNet-1k recipe for the periodic loss-spike issue:
  # keep the numerically stable wedge path, lengthen warmup, keep EMA,
  # and leave augmentation strength configurable in this recipe layer.
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  label_smoothing: 0.1
  ema_decay: 0.9999
  warmup_epochs: 10
  eta_min: 1.0e-6

optim:
  base_lr: 3.0e-4
  base_global_batch_size: 1024
  scale_lr: true
  weight_decay: 0.05

training:
  batch_size: 0
  target_global_batch_size: 1024
  gradient_clip_val: 1.0
  val_check_interval: 0.25

checkpoint:
  save_top_k: 3
  save_last: true

wandb:
  project: CliffordNet
